server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Los assets con hash son inmutables; index.html nunca se cachea (así un despliegue nuevo se ve al recargar).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  # SPA: cualquier ruta que no sea un archivo cae en index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
