# Cloud Build del Front de __PROJECT_NAME__ (Cloud Run): construir -> subir -> desplegar.
# Las variables públicas del cliente (NEXT_PUBLIC_* en Next.js, VITE_* en Vue) se INCRUSTAN en el bundle al compilar, por eso
# van como --build-arg y no como variables del servicio: cambiarlas exige reconstruir la imagen. Los valores reales por
# entorno los pone el trigger (deploy/<entorno>.env, repo raíz).
# Despliega primero la API: el portal necesita su URL. Guía: `cloudrun-kit guide`.

substitutions:
  _REGION: __GCP_REGION__
  _AR_REPO: __PROJECT__
  _SERVICE: __PROJECT__-front-staging
  _IMAGE: __PROJECT__-front
  _RUNTIME_SA: __PROJECT__-web@__GCP_PROJECT__.iam.gserviceaccount.com
  _PORT: '8080'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '5'
# @if next
  _INTERNAL_API_URL: https://URL-DE-LA-API.run.app
  _SITE_URL: ''
  _PUSHER_KEY: ''
  _PUSHER_CLUSTER: us2
  _GOOGLE_MAPS_KEY: ''
# @else
  _API_URL: https://URL-DE-LA-API.run.app/api/v1
# @endif

options:
  logging: CLOUD_LOGGING_ONLY
  # El trigger puede pasar sustituciones que este archivo no use sin que el build falle.
  substitution_option: ALLOW_LOOSE
  env:
    - DOCKER_BUILDKIT=1

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=production
      - --build-arg=BUILDKIT_INLINE_CACHE=1
# @if next
      - --build-arg=NEXT_PUBLIC_API_URL=/api
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_PUSHER_KEY=${_PUSHER_KEY}
      - --build-arg=NEXT_PUBLIC_PUSHER_CLUSTER=${_PUSHER_CLUSTER}
      - --build-arg=NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${_GOOGLE_MAPS_KEY}
# @else
      - --build-arg=VITE_API_URL=${_API_URL}
# @endif
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${BUILD_ID}
      - --service-account=${_RUNTIME_SA}
      - --port=${_PORT}
      - --allow-unauthenticated
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --cpu=1
      - --memory=512Mi
      - --cpu-boost
# @if next
      # `INTERNAL_API_URL` (URL de la API) es de runtime: el servidor de Next (BFF) la lee al arrancar.
      - --update-env-vars=^#^NODE_ENV=production#INTERNAL_API_URL=${_INTERNAL_API_URL}
# @endif

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest
